name: Docker Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: qemu setup
        uses: docker/setup-qemu-action@v3

      - name: buildx setup
        uses: docker/setup-buildx-action@v3

      - name: docker login
        run: echo "${{ secrets.STJUDECLOUD_REGISTRY_PASSWORD }}" | docker login ${{ secrets.STJUDECLOUD_REGISTRY_URL }} --username ${{ secrets.STJUDECLOUD_REGISTRY_USERNAME }} --password-stdin

      - name: set environment
        run: |
          echo "REPOSITORY=${GITHUB_REPOSITORY}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${SOURCE_SHA::7}" >> $GITHUB_ENV
          echo "LABEL_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> $GITHUB_ENV
          echo "LABEL_REVISION=${SOURCE_SHA}" >> $GITHUB_ENV

      - name: docker build
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          tags: ${{ secrets.STJUDECLOUD_REGISTRY_URL }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ secrets.STJUDECLOUD_REGISTRY_URL }}/${{ env.REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ secrets.STJUDECLOUD_REGISTRY_URL }}/${{ env.REPOSITORY }}:buildcache,mode=max
          pull: true
          push: true
          build-args: |
            NUXT_UI_PRO_LICENSE=${{ secrets.NUXT_UI_PRO_LICENSE }}
          labels: |
            org.opencontainers.image.title=${{ env.REPOSITORY }}
            org.opencontainers.image.url=${{ env.LABEL_URL }}
            org.opencontainers.image.source=${{ env.LABEL_URL }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ env.LABEL_REVISION }}
