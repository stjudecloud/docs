name: Link Check

on:
  schedule:
    - cron: 37 21 * * *
  pull_request:
    branches:
      - main
    paths:
      - content/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/jod
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: check
        run: pnpm markdown-link-check -q -c .mlc_config.ci.json content/**/**/*.md
