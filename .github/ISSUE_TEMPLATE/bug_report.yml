name: Bug Report
description: Report a problem with the site or documentation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This template is for issues specific to https://docs.stjude.cloud.
        If you have an issue related to St. Jude Cloud that is not specific to the documentation site, please contact [support@stjude.cloud](mailto:support@stjude.cloud).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page URL if applicable.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://docs.stjude.cloud/...
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, etc.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else relevant.
    validations:
      required: false
