apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: docs
  namespace: docs-production
spec:
  interval: 30m
  chart:
    spec:
      chart: generic
      version: 1.1.x
      sourceRef:
        kind: HelmRepository
        name: stjudecloud
        namespace: flux-system
      interval: 1h
  values:
    nameOverride: docs
    image:
      repository: stjudecloud/docs
      tag: v1.12.0 # {"$imagepolicy": "flux-system:docs:tag"}
    podAnnotations:
      linkerd.io/inject: enabled
      config.linkerd.io/proxy-cpu-request: 20m
    containerPorts:
      http: 3000
    resources:
      limits:
        cpu: 1000m
      requests:
        cpu: 100m
    autoscaling:
      enabled: true
    pdb:
      create: true
    service:
      ports:
        - name: http
          protocol: TCP
          port: 3000
          targetPort: http
    ingress:
      enabled: true
      hostname: docs.stjude.cloud
      path: /
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        linkerd.io/inject: ingress
        nginx.ingress.kubernetes.io/service-upstream: "true"
        nginx.ingress.kubernetes.io/enable-modsecurity: "true"
        nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
      tls:
        enabled: true
    datadog:
      enabled: true
      env: production
      service: docs
